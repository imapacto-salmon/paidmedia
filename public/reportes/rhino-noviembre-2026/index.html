<style>
:root{--bg:#FFFFFF;--ink:#141211;--ink2:#5E5754;--line:#E2DBD7;--acc:#E8604C;--bad:#C93A2B;--bar:#000;color-scheme:light}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.gbar{background:var(--bar);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gbar div{max-width:1040px;margin:0 auto;display:flex;justify-content:flex-end;align-items:center;gap:26px}
.gbar img{display:block;width:auto}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px max(16px,env(safe-area-inset-left,0px))}
form{width:100%;max-width:360px;border:1px solid var(--line);border-radius:18px;padding:30px 28px}
h1{font-size:19px;font-weight:600;margin:0 0 6px}
p{margin:0 0 22px;font-size:13px;color:var(--ink2);line-height:1.5}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px}
input{width:100%;font:inherit;font-size:20px;letter-spacing:.3em;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;color:var(--ink);background:#fff}
input:focus{outline:none;border-color:var(--ink)}
button{margin-top:14px;width:100%;font:inherit;font-weight:600;font-size:14px;padding:12px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
</style>

  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);

}
async function tryPw(pw,silent){
  try{const h=await unlock(pw);show(h);return true}
  catch(e){if(!silent){document.getElementById('err').textContent='Contraseña incorrecta. Intenta de nuevo.'};return false}
}
document.getElementById('gate').addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('go');b.disabled=true;b.textContent='Abriendo…';document.getElementById('err').textContent='';
  const ok=await tryPw(document.getElementById('pw').value.trim(),false);
  if(!ok){b.disabled=false;b.textContent='Ver reporte';document.getElementById('pw').select()}
});
})();
</script>
